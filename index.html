<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
  >

  <meta
    name="theme-color"
    content="#8f0f24"
  >

  <title>Şeydanur & Muhammed Safi</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============================= -->
  <!-- LANGUAGE GATE -->
  <!-- ============================= -->

  <div id="languageGate" class="language-gate">

    <div class="language-buttons">

      <button
        type="button"
        class="language-btn"
        data-lang="ar"
      >
        العربية
      </button>

      <button
        type="button"
        class="language-btn"
        data-lang="tr"
      >
        Türkçe
      </button>

    </div>

  </div>


  <!-- ============================= -->
  <!-- MAIN WEBSITE -->
  <!-- ============================= -->

  <main id="site" class="site hidden">


    <!-- LANGUAGE SWITCH -->

    <button
      id="langSwitch"
      class="lang-switch"
      type="button"
      aria-label="Change language"
    >
      TR
    </button>


    <!-- ============================= -->
    <!-- HERO -->
    <!-- ============================= -->

    <section class="hero reveal">

      <div class="hero-inner">

        <div
          class="section-kicker"
          data-i18n="inviteLabel"
        ></div>


        <div class="names">

          <span data-i18n="bride"></span>

          <span class="name-heart">♡</span>

          <span data-i18n="groom"></span>

        </div>


        <div class="hero-hearts">
          ♡ &nbsp; ♥ &nbsp; ♡
        </div>


        <div class="hero-photo polaroid">

          <img
            src="assets/images/couple.jpg"
            alt="Şeydanur and Muhammed"
          >

        </div>


        <div
          class="main-date"
          data-i18n="mainDates"
        ></div>

      </div>

    </section>


    <!-- ============================= -->
    <!-- INTRO / FAMILIES -->
    <!-- ============================= -->

    <section class="section story reveal">

      <div
        class="section-kicker"
        data-i18n="ourDay"
      ></div>


      <h2 data-i18n="twoMoments"></h2>


      <p data-i18n="twoMomentsText"></p>


      <!-- FAMILIES ARE HERE -->

      <div class="families-inline">

        <span data-i18n="brideFamily"></span>

        <span class="families-heart">
          ♡
        </span>

        <span data-i18n="groomFamily"></span>

      </div>


      <div class="doodle-sep">
        ──── ♡ ────
      </div>

    </section>


    <!-- ============================= -->
    <!-- HENNA NIGHT -->
    <!-- ============================= -->

    <section class="section event-section reveal">

      <div class="event-number">
        01
      </div>


      <div class="tiny-heart">
        ♥
      </div>


      <h2 data-i18n="hennaTitle"></h2>


      <h3 data-i18n="hennaDate"></h3>


      <div class="event-photo polaroid">

        <img
          src="assets/images/henna-place.jpg"
          alt="The Nirvanas Hotel"
        >

      </div>


      <div class="event-details">


        <div class="detail-row">

          <span
            class="detail-label"
            data-i18n="timeLabel"
          ></span>

          <strong>
            19:00 – 23:00
          </strong>

        </div>


        <div class="detail-row">

          <span
            class="detail-label"
            data-i18n="placeLabel"
          ></span>

          <strong>
            The Nirvanas Hotel
          </strong>

        </div>


        <div
          class="event-note"
          data-i18n="womenOnly"
        ></div>

      </div>


      <div class="event-actions">

        <a
          class="action-btn"
          href="https://maps.app.goo.gl/rXqN24hERgvm7jWc7"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="openMap"
        ></a>


        <a
          id="hennaCal"
          class="action-btn outline"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="calendar"
        ></a>

      </div>

    </section>


    <!-- ============================= -->
    <!-- NIKAH -->
    <!-- ============================= -->

    <section class="section event-section reveal">

      <div class="event-number">
        02
      </div>


      <div class="tiny-heart">
        ♥
      </div>


      <h2 data-i18n="nikahTitle"></h2>


      <h3 data-i18n="nikahDate"></h3>


      <div class="event-photo polaroid">

        <img
          src="assets/images/nikah-place.jpg"
          alt="Fatih Belediyesi Evlendirme Dairesi"
        >

      </div>


      <div class="event-details">

        <div class="detail-row">

          <span
            class="detail-label"
            data-i18n="timeLabel"
          ></span>

          <strong>
            12:30 – 13:00
          </strong>

        </div>


        <div class="detail-row">

          <span
            class="detail-label"
            data-i18n="placeLabel"
          ></span>

          <strong>
            Fatih Belediyesi
            <br>
            Evlendirme Dairesi
          </strong>

        </div>


        <div
          class="event-note important"
          data-i18n="dontLate"
        ></div>

      </div>


      <div class="event-actions">

        <a
          class="action-btn"
          href="https://maps.app.goo.gl/jmkinTHUaK2jwRYG9"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="openMap"
        ></a>


        <a
          id="nikahCal"
          class="action-btn outline"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="calendar"
        ></a>

      </div>

    </section>


    <!-- ============================= -->
    <!-- SCHEDULE -->
    <!-- ============================= -->

    <section class="section schedule-section reveal">

      <div
        class="section-kicker"
        data-i18n="schedule"
      ></div>


      <h2 data-i18n="momentsTitle"></h2>


      <div class="timeline">


        <div class="timeline-item">

          <div class="timeline-dot"></div>

          <div class="timeline-time">
            15.10
          </div>

          <div
            class="timeline-title"
            data-i18n="hennaTitle"
          ></div>

          <div class="timeline-small">
            19:00 – 23:00
          </div>

        </div>


        <div class="timeline-line"></div>


        <div class="timeline-item">

          <div class="timeline-dot"></div>

          <div class="timeline-time">
            17.10
          </div>

          <div
            class="timeline-title"
            data-i18n="nikahTitle"
          ></div>

          <div class="timeline-small">
            12:30 – 13:00
          </div>

        </div>


      </div>

    </section>


    <!-- ============================= -->
    <!-- COUNTDOWN -->
    <!-- ============================= -->

    <section class="section countdown-section reveal">

      <div
        class="section-kicker"
        data-i18n="remaining"
      ></div>


      <h2 data-i18n="countTitle"></h2>


      <div class="countdown">


        <div class="count-box">

          <strong id="days">
            00
          </strong>

          <span data-i18n="days"></span>

        </div>


        <div class="count-box">

          <strong id="hours">
            00
          </strong>

          <span data-i18n="hours"></span>

        </div>


        <div class="count-box">

          <strong id="minutes">
            00
          </strong>

          <span data-i18n="minutes"></span>

        </div>


        <div class="count-box">

          <strong id="seconds">
            00
          </strong>

          <span data-i18n="seconds"></span>

        </div>


      </div>

    </section>


    <!-- ============================= -->
    <!-- CLOSING -->
    <!-- ============================= -->

    <section class="section closing reveal">

      <div class="closing-hearts">
        ♡ ♥ ♡
      </div>


      <h2 data-i18n="closingTitle"></h2>


      <p data-i18n="closingText"></p>


      <div class="closing-names">

        <span data-i18n="bride"></span>

        <span>
          ♡
        </span>

        <span data-i18n="groom"></span>

      </div>

    </section>


  </main>


  <script src="script.js"></script>

</body>
</html>
